name: Build project website
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the verified build to GitHub Pages
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm run check:source
      - run: npm ci
      - run: npx playwright install --with-deps firefox ffmpeg
      - run: xvfb-run -a npm run build:site
        env:
          EMBERWILD_REPOSITORY: ${{ vars.EMBERWILD_REPOSITORY }}
          HEADED: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .site
  deploy:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (vars.ENABLE_PAGES == 'true' || inputs.deploy == true)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
