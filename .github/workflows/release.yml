name: Build engine release
permissions:
  contents: read
  actions: read
jobs:
  verify:
    uses: ./.github/workflows/full.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: ${{ inputs.tag || github.ref }}
        persist-credentials: false
    - uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
    - run: node -e 'if(process.env.RELEASE_TAG!=="v"+require("./package.json").version)process.exit(1)'
    - run: npm run check:source
    - run: npm ci
    - run: npm test
    - run: npm run test:minimal
    - run: npm run world:check
    - run: npm run package:release
    - run: sha256sum -c SHA256SUMS
      working-directory: dist
    - uses: actions/upload-artifact@v4
      with:
        name: release-files
        path: dist/*
    needs: verify
  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: release-files
        path: release-files
    - run: 'gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "KithCore $RELEASE_TAG" --notes-file release-files/RELEASE_NOTES.md release-files/*

        '
'on':
  push:
    tags:
    - v*
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build
        type: string
        required: true
